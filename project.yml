# Xcode-projektet skapas av XcodeGen i molnet (GitHub Actions), se .github/workflows/build.yml
name: Luftmus
options:
  bundleIdPrefix: se.walid
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Luftmus:
    type: application
    platform: iOS
    sources: [iOS]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Luftmus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.walid.luftmus
        TARGETED_DEVICE_FAMILY: "1"

  LuftmusWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Luftmus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: se.walid.luftmus
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [physical-therapy]
        NSMotionUsageDescription: Luftmus läser handledens rörelser för att styra musen på datorn.
        NSLocalNetworkUsageDescription: Luftmus skickar rörelserna till din dator på samma Wi-Fi.
        NSBluetoothAlwaysUsageDescription: Luftmus kopplar direkt till din dator via Bluetooth för att styra musen.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.walid.luftmus.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
